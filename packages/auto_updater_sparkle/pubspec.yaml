name: auto_updater_sparkle
description: Sparkle implementation of the auto_updater plugin for macOS.
version: 1.0.0
repository: https://github.com/leanflutter/auto_updater/tree/main/packages/auto_updater_sparkle

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

dependencies:
  auto_updater_platform_interface: ^2.0.0
  flutter:
    sdk: flutter
  objective_c: ^9.6.2
  sparkle: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    implements: auto_updater
    platforms:
      macos:
        dartPluginClass: AutoUpdaterSparkle
        ffiPlugin: true

