name: auto_updater_example
description: Demonstrates how to use the auto_updater plugin.
version: 1.0.0+1
publish_to: "none"

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

dependencies:
  auto_updater:
    path: ../
  auto_updater_sparkle:
    path: ../../auto_updater_sparkle
  auto_updater_winsparkle:
    path: ../../auto_updater_winsparkle
  bot_toast: ^4.1.3
  flutter:
    sdk: flutter
  material_ui: ^1.11.0
  window_manager: ^0.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
