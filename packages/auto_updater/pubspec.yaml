name: auto_updater
description: Flutter desktop app updates with a platform implementation chosen by the app.
version: 2.0.0
homepage: https://github.com/leanflutter/auto_updater

platforms:
  macos:
  windows:

topics:
  - auto-updater

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

dependencies:
  auto_updater_platform_interface: ^2.0.0
  flutter:
    sdk: flutter
  json_annotation: ^4.8.0
  path: ^1.8.3

dev_dependencies:
  build_runner: ^2.3.3
  dependency_validator: ^3.0.0
  flutter_test:
    sdk: flutter
  json_serializable: ^6.6.0
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms: {}
