name: auto_updater_windows
description: Windows implementation of the auto_updater plugin.
version: 1.0.0
repository: https://github.com/leanflutter/auto_updater/tree/main/packages/auto_updater_windows

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

dependencies:
  auto_updater_platform_interface: ^1.0.0
  ffi: ^2.2.0
  flutter:
    sdk: flutter
  winsparkle: ^0.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    implements: auto_updater
    platforms:
      windows:
        dartPluginClass: AutoUpdaterWindows
        ffiPlugin: true
