name: Verify WinSparkle critical update controls

on:
  push:
    branches: [codex/verify-winsparkle-critical]

permissions:
  contents: read
  actions: read

jobs:
  smoke:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            architecture: x64
            dart-architecture: x64
          - runner: windows-11-arm
            architecture: ARM64
            dart-architecture: arm64
    steps:
      - uses: actions/checkout@v6
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.14.0'
          architecture: ${{ matrix.dart-architecture }}
      - uses: actions/download-artifact@v8
        with:
          name: winsparkle-${{ matrix.architecture }}
          path: ${{ runner.temp }}/patched-winsparkle
          run-id: 43693960183
          github-token: ${{ github.token }}
      - working-directory: packages/winsparkle
        run: dart pub get
      - name: Verify background checks and critical update controls
        working-directory: packages/winsparkle
        shell: pwsh
        run: |
          $dll = "$env:RUNNER_TEMP/patched-winsparkle/WinSparkle.dll"
          foreach ($scenario in @('ordinary', 'critical')) {
            dart run tool/critical_controls_smoke.dart $dll $scenario
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
