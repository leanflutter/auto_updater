name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.50.0"
  MELOS_VERSION: "6.3.3"

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: analyze
            script: analyze
          - name: format
            script: format-check
          - name: test
            script: test --no-select
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: bluefireteam/melos-action@v3
        with:
          melos-version: ${{ env.MELOS_VERSION }}
      - run: melos run ${{ matrix.script }}

  build:
    name: build-${{ matrix.platform }}${{ matrix.suffix }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            runner: macos-latest
          - platform: windows
            runner: windows-latest
          - platform: windows
            runner: windows-11-arm
            suffix: -arm64
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          architecture: ${{ matrix.platform == 'windows' && 'x64' || '' }}
          # The Arm64 job replaces the Dart SDK from the x64 archive.
          cache: ${{ matrix.runner != 'windows-11-arm' }}
      - name: Select native Dart on Windows Arm64
        if: matrix.runner == 'windows-11-arm'
        env:
          FLUTTER_HOST_ARCH: arm64
        shell: pwsh
        run: |
          $flutterBin = Split-Path (Get-Command flutter).Source
          Remove-Item "$flutterBin/cache/engine-dart-sdk.stamp" -Force
          Remove-Item "$flutterBin/cache/windows-sdk.stamp" -Force -ErrorAction SilentlyContinue
          flutter --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((dart --version 2>&1 | Out-String) -notmatch 'windows_arm64') {
            throw 'Flutter requires a native Dart VM to build for Windows Arm64.'
          }
      - uses: bluefireteam/melos-action@v3
        with:
          melos-version: ${{ env.MELOS_VERSION }}
      - working-directory: packages/auto_updater/example
        run: flutter build ${{ matrix.platform }} --release
      - name: Load the bundled WinSparkle DLL
        if: matrix.platform == 'windows'
        working-directory: packages/winsparkle
        shell: pwsh
        run: |
          $targetArchitecture = '${{ runner.arch }}'.ToLowerInvariant()
          dart run tool/smoke_test.dart "../auto_updater/example/build/windows/$targetArchitecture/runner/Release/WinSparkle.dll"
