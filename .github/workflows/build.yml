  #       with:
  #         flutter-version: "3.50.0"
  #         channel: "stable"
  #     - uses: bluefireteam/melos-action@v3
  #     - working-directory: ./packages/auto_updater/example
  #       run: |
  #         flutter build web --release

  build-windows:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: "stable"
          architecture: x64
      - name: Select native Windows Arm64 Flutter artifacts
        if: runner.arch == 'ARM64'
        env:
          FLUTTER_HOST_ARCH: arm64
        run: |
          # The stable Windows archive includes an x64 Dart SDK. Flutter
          # chooses the build target from the architecture of the Dart VM.
          $flutterBin = Split-Path (Get-Command flutter).Source
          Remove-Item "$flutterBin/cache/engine-dart-sdk.stamp" -Force
          Remove-Item "$flutterBin/cache/windows-sdk.stamp" -Force -ErrorAction SilentlyContinue
          flutter --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((dart --version 2>&1 | Out-String) -notmatch 'windows_arm64') {
            throw 'Flutter requires a native Dart VM to build for Windows Arm64.'
          }
      - uses: bluefireteam/melos-action@v3
        with:
          melos-version: "6.3.3"
      - working-directory: ./packages/auto_updater/example
        run: |
          flutter build windows --release
      - name: Load the bundled WinSparkle DLL
        working-directory: ./packages/winsparkle
        run: |
          $targetArchitecture = '${{ runner.arch }}'.ToLowerInvariant()
          dart run tool/smoke_test.dart "../auto_updater/example/build/windows/$targetArchitecture/runner/Release/WinSparkle.dll"
