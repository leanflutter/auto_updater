name: Reproduce WinSparkle install dialog ordering

on:
  push:
    branches: [codex/repro-winsparkle-install-window]

permissions:
  contents: read
  actions: read

jobs:
  reproduce:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          architecture: x64
      - uses: actions/download-artifact@v8
        with:
          run-id: 43690237694
          github-token: ${{ github.token }}
          name: winsparkle-x64
          path: ${{ runner.temp }}/patched-winsparkle
      - shell: pwsh
        run: |
          Copy-Item "$env:RUNNER_TEMP/patched-winsparkle/WinSparkle.dll" packages/auto_updater_winsparkle/windows/WinSparkle-0.9.4/x64/Release
          dart run melos bootstrap
      - name: Check the Ready to install dialog position
        working-directory: packages/auto_updater/example
        shell: pwsh
        run: |
          flutter build windows --release -t lib/codex_install_window_smoke.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $release = Resolve-Path 'build/windows/x64/runner/Release'
          $app = Start-Process -WorkingDirectory $release -PassThru (Join-Path $release 'auto_updater_example.exe')
          if (!$app.WaitForExit(55000)) {
            $app.Kill()
            throw 'Install dialog reproduction timed out.'
          }
          Get-Content (Join-Path $release 'install-window.result')
          exit $app.ExitCode
