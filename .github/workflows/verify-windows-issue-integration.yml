name: Verify Integrated Windows updater

on:
  push:
    branches: [codex/verify-windows-issue-integration]

permissions:
  contents: read
  actions: read

jobs:
  smoke:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            architecture: x64
            dart-architecture: x64
          - runner: windows-11-arm
            architecture: ARM64
            dart-architecture: arm64
    steps:
      - uses: actions/checkout@v6
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.14.0'
          architecture: ${{ matrix.dart-architecture }}
      - uses: actions/download-artifact@v8
        with:
          name: winsparkle-${{ matrix.architecture }}
          path: ${{ runner.temp }}/patched-winsparkle
          run-id: 43693960183
          github-token: ${{ github.token }}
      - working-directory: packages/winsparkle
        run: dart pub get
      - name: Verify bundled ABI and enclosure resolution
        working-directory: packages/winsparkle
        shell: pwsh
        run: |
          $dll = "$env:RUNNER_TEMP/patched-winsparkle/WinSparkle.dll"
          dart run tool/smoke_test.dart $dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dart run tool/relative_enclosure_smoke.dart $dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dart run tool/verify_redirect_headers.dart $dll


  flutter-msi:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            architecture: x64
          - runner: windows-11-arm
            architecture: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          architecture: x64
          cache: ${{ matrix.architecture == 'x64' }}
      - name: Select native Dart on Windows Arm64
        if: matrix.architecture == 'arm64'
        env:
          FLUTTER_HOST_ARCH: arm64
        shell: pwsh
        run: |
          $flutterBin = Split-Path (Get-Command flutter).Source
          Remove-Item "$flutterBin/cache/engine-dart-sdk.stamp" -Force
          Remove-Item "$flutterBin/cache/windows-sdk.stamp" -Force -ErrorAction SilentlyContinue
          flutter --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((dart --version 2>&1 | Out-String) -notmatch 'windows_arm64') {
            throw 'Expected the native Dart VM.'
          }
      - name: Build Release fixture with the shipped example and WinSparkle
        shell: pwsh
        run: |
          dart run melos bootstrap
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Set-Location packages/auto_updater/example
          flutter build windows --release -t lib/codex_integrated_msi_smoke.dart
      - name: Verify shutdown and signed MSI upgrade from the native dialog
        shell: pwsh
        env:
          CODEX_INSTALL_MODE: dialog
        run: |
          $arch = '${{ matrix.architecture }}'
          $release = (Resolve-Path "packages/auto_updater/example/build/windows/$arch/runner/Release").Path
          ./packages/winsparkle/tool/fixtures/msi_update.ps1 -ReleaseDirectory $release -Architecture $arch
